services:
  db:
    image: mysql:8.0
    container_name: upcycleconnect_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: upcycle
      MYSQL_USER: app
      MYSQL_PASSWORD: secret
    volumes:
      - ./db_schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 2s
      retries: 10
    networks:
      - DataNetwork

  api:
    build:
      context: ./PA - API
      dockerfile: Dockerfile
    image: llabarbe/upcycleconnect-api
    container_name: upcycleconnect_api
    ports:
      - "9999:9999"
    env_file:
      - "PA - API/.env"
    environment:
      API_PORT: "9999"
      API_HOST: "0.0.0.0"
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: app
      DB_PASSWORD: secret
      DB_NAME: upcycle
      APP_API_KEY: "replace-with-secure-key"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - DataNetwork
      - APIClientNetwork

  bo:
    build:
      context: ./PA - BO
      dockerfile: Dockerfile
    image: llabarbe/upcycleconnect-bo
    container_name: upcycleconnect_bo
    env_file:
      - "PA - BO/.env"
    environment:
      API_HOST: api
      BASE_URL: /
    volumes:
      - ./files:/var/www/html/files
    ports:
      - "8080:80"
    depends_on:
      - db
      - api
    networks:
      - APIClientNetwork

  site_principal:
    build:
      context: ./PA - Site Principal
      dockerfile: Dockerfile
    image: llabarbe/upcycleconnect-fo
    container_name: upcycleconnect-fo
    env_file:
      - "PA - Site Principal/.env"
    environment:
      API_HOST: api
      API_PORT: "9999"
      BO_PUBLIC_URL: http://localhost:8080
      GOOGLE_REDIRECT_URI: http://localhost:8081/pages/public/oauth-callback-google
      FACEBOOK_REDIRECT_URI: http://localhost:8081/pages/public/oauth-callback-facebook.php
    volumes:
      - ./files:/var/www/html/files
    ports:
      - "8081:80"
    depends_on:
      - api
    networks:
      - APIClientNetwork

  glpi:
    image: diouxx/glpi:latest
    container_name: upcycleconnect_glpi
    restart: unless-stopped
    environment:
      TIMEZONE: Europe/Paris
      MARIADB_HOST: db
      MARIADB_PORT: "3306"
      MARIADB_DATABASE: glpi
      MARIADB_USER: glpi_user
      MARIADB_PASSWORD: glpi_secret
    ports:
      - "8082:80"
    volumes:
      - glpi_data:/var/www/html
      - glpi_config:/etc/glpi
      - glpi_files:/var/www/html/files
    depends_on:
      - db
    networks:
      - DataNetwork
      - APIClientNetwork

networks:
  DataNetwork:
    driver: bridge
  APIClientNetwork:
    driver: bridge

volumes:
  db_data:
    driver: local
  glpi_data:
    driver: local
  glpi_config:
    driver: local
  glpi_files:
    driver: local
