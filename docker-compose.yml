services:
  db:
    image: mysql:8.0
    container_name: upcycleconnect_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: upcycle
      MYSQL_USER: app
      MYSQL_PASSWORD: secret
    volumes:
      - ./db_schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 2s
      retries: 10
    networks:
      - DataNetwork

  api:
    image: llabarbe/upcycleconnect-api
    container_name: upcycleconnect_api
    ports:
      - "9999:9999"
    environment:
      API_PORT: "9999"
      API_HOST: "0.0.0.0"
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: app
      DB_PASSWORD: secret
      DB_NAME: upcycle
      APP_API_KEY: "replace-with-secure-key"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - DataNetwork

networks:
  DataNetwork:
    driver: bridge

volumes:
  db_data:
    driver: local
