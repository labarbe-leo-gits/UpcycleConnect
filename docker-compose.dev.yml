services:
  db:
    image: mysql:8.0
    container_name: upcycleconnect_db_dev
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: upcycle
      MYSQL_USER: app
      MYSQL_PASSWORD: secret
    volumes:
      - ./db_schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - db_data_dev:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 2s
      retries: 10
    networks:
      - DataNetwork

  api:
    image: golang:1.25
    container_name: upcycleconnect_api_dev
    ports:
      - "9999:9999"
    env_file:
      - "PA - API/.env"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: app
      DB_PASSWORD: secret
      DB_NAME: upcycle
      API_HOST: "0.0.0.0"
      API_PORT: "9999"
    volumes:
      - ./PA - API:/workspace:delegated
      - ./files:/files:ro
      - ./PA - API/.env:/app/.env:ro
    working_dir: /workspace
    command: >
      sh -c "go mod download && go run ."
    depends_on:
      db:
        condition: service_healthy
    networks:
      - DataNetwork
      - APIClientNetwork

  bo:
    build:
      context: ./PA - BO
      dockerfile: Dockerfile.dev
    container_name: upcycleconnect_bo_dev
    ports:
      - "8080:80"
    env_file:
      - "PA - BO/.env"
    environment:
      API_HOST: api
      API_PORT: "9999"
      BASE_URL: "/"
    volumes:
      - ./PA - BO:/var/www/html:delegated
      - ./files:/var/www/html/files:delegated
      - ./PA - API/data:/var/www/html/api-data:delegated
      - ./PA - BO/.env.docker:/var/www/html/.env:ro
      - ./PA - BO/.env:/var/www/html/.env:ro
      - ./vendor:/var/www/html/vendor:ro
    depends_on:
      - db
      - api
    networks:
      - APIClientNetwork

  fo:
    build:
      context: ./PA - Site Principal
      dockerfile: Dockerfile.dev
    container_name: upcycleconnect_fo_dev
    ports:
      - "8081:80"
    env_file:
      - "PA - Site Principal/.env"
    environment:
      API_HOST: api
      API_PORT: "9999"
      BASE_URL: "/"
      APP_ENV: development
    volumes:
      - ./PA - Site Principal:/var/www/html:delegated
      - ./files:/var/www/html/files:delegated
      - ./PA - Site Principal/.env:/var/www/html/.env:ro
      - ./vendor:/var/www/html/vendor:ro
    depends_on:
      - db
      - api
    networks:
      - APIClientNetwork

  glpi:
    image: diouxx/glpi:latest
    container_name: upcycleconnect_glpi
    restart: unless-stopped
    environment:
      TIMEZONE: Europe/Paris
      MARIADB_HOST: db
      MARIADB_PORT: "3306"
      MARIADB_DATABASE: glpi
      MARIADB_USER: glpi_user
      MARIADB_PASSWORD: glpi_secret
    ports:
      - "8082:80"
    volumes:
      - glpi_data:/var/www/html
      - glpi_config:/etc/glpi
      - glpi_files:/var/www/html/files
    depends_on:
      - db
    networks:
      - DataNetwork
      - APIClientNetwork

  processes:
    build:
      context: "./PA - Automated Processes"
    container_name: upcycle_cron_dev
    restart: unless-stopped
    env_file:
      - "PA - Automated Processes/.env"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=app
      - DB_PASSWORD=secret
      - DB_NAME=upcycle
    volumes:
      - "./PA - Automated Processes:/app:delegated"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - DataNetwork
      - APIClientNetwork

networks:
  DataNetwork:
    driver: bridge
  APIClientNetwork:
    driver: bridge

volumes:
  db_data_dev:
    driver: local
  glpi_data:
    driver: local
  glpi_config:
    driver: local
  glpi_files:
    driver: local
